[project]
name = "legal-bot"
version = "0.1.0"
description = "Telegram bot AI-агент по российскому законодательству"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "python-telegram-bot[job-queue]>=22",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pdfminer.six>=20231228",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
